    <path d="M330 200 C325 220, 328 240, 335 255"/>
    <path d="M340 210 C338 225, 340 240, 345 250"/>
    <path d="M470 200 C475 220, 472 240, 465 255"/>
    <path d="M460 210 C462 225, 460 240, 455 250"/>
    
