    <path d="M340 295 C330 330, 340 360, 360 380"/>
    <path d="M355 310 C350 335, 355 360, 370 375"/>
    <path d="M460 295 C470 330, 460 360, 440 380"/>
    <path d="M445 310 C450 335, 445 360, 430 375"/>
