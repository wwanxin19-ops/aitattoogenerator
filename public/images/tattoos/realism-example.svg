    <path d="M260 320 L245 310"/>
    <path d="M255 300 L240 295"/>
    <path d="M265 280 L250 275"/>
    <path d="M520 350 C540 330, 550 300, 540 270"/>
    <path d="M540 320 L555 310"/>
