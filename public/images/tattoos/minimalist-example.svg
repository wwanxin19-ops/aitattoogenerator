<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15120e"/>
      <stop offset="100%" stop-color="#211c16"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg2)" rx="24"/>
  
  <!-- 极简花卉线条 -->
  <g fill="none" stroke="#f4e9d8" stroke-width="1.2" opacity="0.85">
    <!-- 主茎 -->
    <path d="M400 420 C400 380, 395 340, 400 300 C405 260, 395 220, 400 180" 
          stroke-linecap="round"/>
    
    <!-- 牡丹花瓣 - 极简线条 -->
    <!-- 外层花瓣 -->
    <path d="M400 180 C370 160, 340 170, 330 200 C320 230, 340 260, 370 270"/>
    <path d="M400 180 C430 160, 460 170, 470 200 C480 230, 460 260, 430 270"/>
    <path d="M370 270 C350 290, 360 320, 385 330"/>
    <path d="M430 270 C450 290, 440 320, 415 330"/>
    
    <!-- 内层花瓣 -->
    <path d="M400 180 C385 190, 375 210, 385 230 C395 250, 410 250, 415 230"/>
    <path d="M400 180 C415 190, 425 210, 415 230"/>
    
    <!-- 花蕊 -->
    <circle cx="400" cy="210" r="8" stroke="#b96a3c" fill="none"/>
    <path d="M400 202 L400 218" stroke="#b96a3c"/>
    <path d="M392 210 L408 210" stroke="#b96a3c"/>
    
    
    <!-- 叶子 -->
    <path d="M400 320 C370 310, 350 330, 355 350 C360 370, 380 380, 400 370"/>
    <path d="M400 280 C430 270, 450 290, 445 310 C440 330, 420 340, 400 330"/>
    
    <!-- 叶脉 -->
    <path d="M355 350 L375 345" stroke-width="0.8" opacity="0.5"/>
    <path d="M445 310 L425 305" stroke-width="0.8" opacity="0.5"/>
    
    
    <!-- 小枝 -->
    <path d="M400 360 C380 370, 370 390, 375 410" stroke-width="0.8"/>
    <path d="M400 340 C420 350, 430 370, 425 390" stroke-width="0.8"/>
  </g>
  
  <!-- 装饰点 -->
  <circle cx="330" cy="380" r="2" fill="#b96a3c" opacity="0.4"/>
  <circle cx="470" cy="360" r="2" fill="#b96a3c" opacity="0.4"/>
  <circle cx="350" cy="420" r="1.5" fill="#b96a3c" opacity="0.3"/>
  <circle cx="450" cy="400" r="1.5" fill="#b96a3c" opacity="0.3"/>
  
  
  <!-- 标签 -->
  <text x="400" y="460" text-anchor="middle" fill="#a9957d" font-family="monospace" font-size="12" letter-spacing="2">MINIMALIST TATTOO STYLE</text>
</svg>