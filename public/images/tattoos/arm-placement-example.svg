<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15120e"/>
      <stop offset="100%" stop-color="#211c16"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8c7aa" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#e8c7aa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e8c7aa" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg3)" rx="24"/>
  
  
  <!-- 三个手臂轮廓 -->
  
  <!-- 左：上臂/肩膀 -->
  <g transform="translate(150, 100)">
    <!-- 手臂轮廓 -->
    <path d="M60 20 
             C40 30, 30 60, 35 100
             C40 140, 50 180, 55 220
             C58 260, 55 290, 50 320
             L70 320
             C75 290, 78 260, 75 220
             C70 180, 80 140, 85 100
             C90 60, 80 30, 60 20Z" 
          fill="url(#skin)" stroke="#e8c7aa" stroke-width="1" opacity="0.6"/>
    
    <!-- 肩部纹身 - 曼陀罗风格 -->
    <g fill="none" stroke="#b96a3c" stroke-width="0.8" opacity="0.7">
      <circle cx="60" cy="80" r="25"/>
      <circle cx="60" cy="80" r="18"/>
      <circle cx="60" cy="80" r="10"/>
      <path d="M60 55 L60 65 M60 95 L60 105 M35 80 L45 80 M75 80 L85 80"/>
      <path d="M43 63 L50 70 M43 97 L50 90 M77 63 L70 70 M77 97 L70 90"/>
    </g>
    
    <!-- 标签 -->
    <text x="60" y="360" text-anchor="middle" fill="#a9957d" font-family="monospace" font-size="10" letter-spacing="1">SHOULDER</text>
  </g>
  
  
  <!-- 中：前臂 -->
  <g transform="translate(350, 100)">
    <!-- 手臂轮廓 -->
    <path d="M55 80
             C45 85, 38 110, 40 150
             C42 190, 48 230, 50 270
             C52 310, 50 340, 48 370
             L68 370
             C70 340, 72 310, 70 270
             C68 230, 62 190, 65 150
             C68 110, 65 85, 55 80Z"
          fill="url(#skin)" stroke="#e8c7aa" stroke-width="1" opacity="0.6"/>
    
    
    <!-- 前臂纹身 - 日式锦鲤 -->
    <g fill="none" stroke="#b96a3c" stroke-width="0.8" opacity="0.7">
      <!-- 鱼身 -->
      <path d="M45 180 C55 170, 70 175, 75 190 C80 205, 70 220, 55 225 C45 228, 35 220, 40 210"/>
      
      <!-- 鱼鳞纹理 -->
      <path d="M50 185 L55 190 L50 195"/>
      <path d="M58 188 L63 193 L58 198"/>
      <path d="M65 192 L70 197 L65 202"/>
      
      
      <!-- 鱼尾 -->
      <path d="M40 210 L30 200 L35 215 L25 225"/>
      
      
      <!-- 水波纹 -->
      <path d="M35 230 C45 235, 55 230, 65 235" stroke-width="0.5"/>
      <path d="M40 240 C50 245, 60 240, 70 245" stroke-width="0.5"/>
    </g>
    
    
    <!-- 标签 -->
    <text x="58" y="400" text-anchor="middle" fill="#a9957d" font-family="monospace" font-size="10" letter-spacing="1">FOREARM</text>
  </g>
  
  
  <!-- 右：手腕 -->
  <g transform="translate(550, 100)">
    <!-- 手臂轮廓 -->
    <path d="M58 280
             C52 285, 48 300, 50 330
             C52 360, 55 390, 55 420
             C55 450, 53 470, 52 480
             L68 480
             C67 470, 65 450, 65 420
             C65 390, 68 360, 70 330
             C72 300, 68 285, 62 280Z"
          fill="url(#skin)" stroke="#e8c7aa" stroke-width="1" opacity="0.6"/>
    
    
    <!-- 手腕纹身 - 小罗盘 -->
    <g fill="none" stroke="#b96a3c" stroke-width="0.8" opacity="0.7">
      <circle cx="60" cy="340" r="18"/>
      <circle cx="60" cy="340" r="12"/>
      <path d="M60 322 L60 328 M60 352 L60 358 M42 340 L48 340 M72 340 L78 340"/>
      <path d="M60 328 L55 340 L60 352 L65 340Z" fill="#b96a3c" fill-opacity="0.2"/>
      
      <!-- 方向标记 -->
      <text x="60" y="318" text-anchor="middle" fill="#b96a3c" font-size="6" font-family="monospace">N</text>
      <text x="60" y="365" text-anchor="middle" fill="#b96a3c" font-size="6" font-family="monospace">S</text>
      <text x="38" y="343" text-anchor="middle" fill="#b96a3c" font-size="6" font-family="monospace">W</text>
      <text x="82" y="343" text-anchor="middle" fill="#b96a3c" font-size="6" font-family="monospace">E</text>
    </g>
    
    
    <!-- 标签 -->
    <text x="60" y="510" text-anchor="middle" fill="#a9957d" font-family="monospace" font-size="10" letter-spacing="1">WRIST</text>
  </g>
  
  
  <!-- 连接线 -->
  <g stroke="#a9957d" stroke-width="0.5" opacity="0.3" stroke-dasharray="4,4">
    <line x1="210" y1="280" x2="350" y2="280"/>
    <line x1="408" y1="280" x2="550" y2="280"/>
  </g>
  
  
  <!-- 主标签 -->
  <text x="400" y="460" text-anchor="middle" fill="#a9957d" font-family="monospace" font-size="12" letter-spacing="2">ARM TATTOO PLACEMENTS</text>
</svg>